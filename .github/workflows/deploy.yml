name: Deploy Clean Static Website with Next.js Tech Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js static export & Assemble Clean Deployment Bundle
        run: npm run build

      - name: Verify Clean Deployment Directory
        run: |
          test -f dist-deploy/index.html
          test -f dist-deploy/tech.html
          test -f dist-deploy/about.html
          test -f dist-deploy/CNAME
          test -d dist-deploy/_next
          # Verify development files are NOT in deploy artifact
          test ! -d dist-deploy/src
          test ! -d dist-deploy/node_modules
          test ! -f dist-deploy/package.json
          test ! -f dist-deploy/tsconfig.json

      - name: Upload clean artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist-deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
